# Schema for the configuration files of the clear_layers theme.
clear_layers.settings:
  type: theme_settings
  label: 'clear_layers settings'
  mapping:
    glass_depth:
      type: string
      label: 'Glass surface elevation preset'
      constraints:
        Choice: [none, subtle, standard, strong]
    glass_transparency:
      type: integer
      label: 'Glass surface transparency in percent'
      constraints:
        Range:
          min: 0
          max: 100
    glass_blur:
      type: integer
      label: 'Glass background blur in pixels'
      constraints:
        Range:
          min: 0
          max: 40
    block_spacing:
      type: integer
      label: 'Spacing between top-level page blocks in pixels'
      constraints:
        Range:
          min: 0
          max: 64
    page_gutter:
      type: integer
      label: 'Page side gutters in pixels'
      constraints:
        Range:
          min: 0
          max: 64
    background_image:
      type: string
      label: 'Bundled page background image filename (empty uses theme default)'
    background_media_uuid:
      type: string
      label: 'Previously saved background media UUID (retained until a bundled image is selected)'
    color_palette:
      type: string
      label: 'Site-wide Clear Layers color palette'
      constraints:
        Choice: [ocean, arctic, indigo, lagoon, green_mint, green_teal, red_rose, red_coral, amber_gold, amber_orange, monochrome_silver, monochrome_charcoal]
    display_back_to_top:
      type: boolean
      label: 'Display a back to top button on the site'
    mobile_menu_direction:
      type: string
      label: 'Mobile menu direction'
