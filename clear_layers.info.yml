name: 'Clear Layers'
type: theme
'base theme': false
version: 1.1.5
screenshot: images/theme-preview-five-colors.png
libraries:
  - clear_layers/base
  - clear_layers/messages
  - core/normalize
  - clear_layers/global
libraries-extend:
  user/drupal.user:
    - clear_layers/user
  core/drupal.dropbutton:
    - clear_layers/dropbutton
  core/drupal.dialog:
    - clear_layers/dialog
  file/drupal.file:
    - clear_layers/file
  core/drupal.item-list:
    - clear_layers/item-list
  core/drupal.progress:
    - clear_layers/progress
  core/drupal.tablesort:
    - clear_layers/drupal.tablesort
description: 'An independent Drupal theme with translucent layers, soft blur and light/dark appearances.'
core_version_requirement: ^11
generator: 'starterkit_theme:11.4.9'
dependencies:
  - 'twig_field_value:twig_field_value'
  - 'twig_tweak:twig_tweak'
regions:
  alert: Alert
  branding: Branding
  navigation: Navigation
  highlighted: Highlighted
  help: Help
  breadcrumb: Breadcrumb
  content: Content
  sidebar_first: 'First Sidebar'
  sidebar_second: 'Second Sidebar'
  footer: Footer
ckeditor5-stylesheets:
  - components/01-elements/wysiwyg.css
