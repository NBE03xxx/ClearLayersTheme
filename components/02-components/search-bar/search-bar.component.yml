$schema: https://git.drupalcode.org/project/sdc/-/raw/1.x/src/metadata.schema.json
name: 検索パネル（開閉）
group: 操作・補助
status: experimental
description: Search bar component for the global header.
slots:
  content:
    title: Search Form Content
    description: The rendered search form injected into the collapsible panel.
props:
  type: object
  properties:
    button_text:
      type: string
      title: Toggle Button Text
      description: Accessible label for opening the search panel. Defaults to the translated "検索を開く".
      examples:
        - 'Expand Search'
        - 'Open Search'
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
