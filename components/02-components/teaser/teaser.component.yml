$schema: https://git.drupalcode.org/project/sdc/-/raw/1.x/src/metadata.schema.json
name: コンテンツ紹介（Teaser）
group: 本文コンテンツ
status: 'experimental'
description: A Teaser component
props:
  type: object
  properties:
    variant:
      type: ['string', 'null']
      title: Variant
      enum:
        - card
        - panel
    title:
      type: ['string', 'null']
      title: 'Title'
      examples:
        - 'A new exhibit opens at the Student Visitor Center'
    media:
      type: ['string', 'null']
      title: Media
      description: 'Rendered media markup (image, video, etc.) displayed above the teaser content.'
    link_text:
      type: ['string', 'null']
      title: 'More Link Text'
    link_url:
      type: ['string', 'null']
      title: 'More Link Url'
    body:
      title: Body
      type: ['string', 'null']
      examples:
        - '<p>The human body is a marvel and does so amazing things for us everyday.</p>'
