$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: 分類・タグの一覧
group: 記事一覧・外部情報
description: 分類・タグの一覧用パネルです。標準の分類一覧では Views 側の Twig から利用し、見出しと記事一覧を表示します。共通の外枠はサイト共通レイアウトで編集します。
status: stable
props:
  type: object
  properties:
    show_title:
      type: boolean
      title: 分類名を表示
      default: true
      examples: [true]
    title_alignment:
      type: string
      title: タイトルの表示位置
      enum: [left, center, right]
      meta:enum:
        left: 左
        center: 中央
        right: 右
      default: left
      examples: [left]
    title_size:
      type: integer
      title: タイトルの文字サイズ（px）
      minimum: 12
      maximum: 72
      default: 32
      examples: [32]
slots:
  content:
    title: 分類に属する記事一覧
    description: 一覧の出力を配置します。標準の分類一覧では Views が生成した記事一覧・絞り込み・ページャーを表示します。
