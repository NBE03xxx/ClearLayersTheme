$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: サイト共通ヘッダー・フッター（旧構成）
group: サイト共通
description: 旧パターン参照との互換用です。新しい構成では「サイト共通レイアウト」でヘッダー・フッターを直接編集してください。この参照は移行後のレイアウトとは同期しません。
status: stable
props:
  type: object
  required: [section]
  properties:
    section:
      type: string
      title: 共通部品
      description: '旧構成用の参照です。通常の共通部分は <a href="/canvas/editor/page_variant/site_layout" target="_blank" rel="noopener">サイト共通レイアウトを編集（別タブ）</a> から変更してください。旧参照の内容を調べる場合は site_header / site_footer パターンを確認します。'
      enum: [header, footer]
      meta:enum:
        header: ナビゲーションとヘッダー
        footer: フッター
      default: header
      examples: [header]
# There are no editor-managed slots. The render callback supplies the content.
